name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0. Must match package.json.
        required: true
        type: string

# Build jobs run third-party code (npm ci, electron-builder) with read-only access; only publish can write.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check the tag matches package.json
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          v=$(node -p "require('./package.json').version")
          [ "$INPUT_TAG" = "v$v" ] || { echo "Tag $INPUT_TAG does not match package.json $v"; exit 1; }
      - run: npm run build
      - name: Package (unsigned)
        run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Collect installers
        shell: bash
        run: |
          mkdir ship
          find release -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} ship/ \;
          ls -la ship
          test -n "$(ls ship)"
      - uses: actions/upload-artifact@v4
        with:
          name: space-studio-${{ matrix.target }}
          if-no-files-found: error
          path: ship/*

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ship
          merge-multiple: true
      - name: Checksums
        run: cd ship && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" ship/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Space Studio ${TAG#v}" \
            --notes "First build of Space Studio by Keplar. Installers are not code-signed yet: Windows SmartScreen and macOS Gatekeeper will warn (macOS: right-click → Open). See docs/STATUS.md for what works and what doesn't yet. Verify downloads with SHA256SUMS."
